<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shopping cart page for Real Beauty products">
    <title>Cart | Real</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="canonical" href="https://sandraoraovcic.github.io/real/pages/cart.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- Navbar start -->
    <div id="nav-mount"></div>
    <!-- Navbar end -->

    <!-- Cart start -->
    <section id="cart-section">
        <div class="container">
            <div class="cart-heading text-center">
                <p>Your beauty selection</p>
                <h1>Shopping Cart</h1>
                <p class="cart-description">
                    Review your selected products, update their quantity or remove them from your cart.
                </p>
            </div>

            <div id="cartMessage"></div>

            <div id="cartContainer"></div>

            <div id="cartSummary"></div>
        </div>
    </section>
    <!-- Cart end -->

    <!-- Footer start -->
    <div id="footer-mount"></div>
    <!-- Footer end -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../assets/script/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
